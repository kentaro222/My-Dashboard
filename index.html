<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<style>
:root{--bg:#0a0d12;--panel:rgba(15,20,28,.58);--text:#f4f7fb;--muted:rgba(244,247,251,.62);--border:rgba(255,255,255,.09);--accent:#9ecbff;--radius:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090c10;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","Hiragino Sans",Meiryo,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 20% 15%, #1e3550 0%, #101722 38%, #080b10 100%);background-size:cover;background-position:center;background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,8,12,.28),rgba(5,8,12,.68));pointer-events:none;z-index:-1}
button,input{font:inherit}button{color:inherit;cursor:pointer}
.app{width:min(1180px,calc(100% - 32px));margin:auto;padding:28px 0 46px}
.top{display:flex;justify-content:space-between;align-items:center}.weather{color:var(--muted);font-size:14px}
.icon,.btn{border:1px solid var(--border);background:rgba(255,255,255,.055);border-radius:12px;padding:9px 11px;color:inherit}.icon{width:42px;height:42px}
.hero{text-align:center;padding:34px 0 26px}.date{color:var(--muted);font-size:13px;letter-spacing:.15em}.clock{font-size:clamp(72px,13vw,150px);font-weight:200;letter-spacing:-.055em;font-variant-numeric:tabular-nums;line-height:.95;margin-top:10px}
.searchw{max-width:720px;margin:28px auto 0}.search{width:100%;height:58px;border-radius:17px;border:1px solid var(--border);background:rgba(255,255,255,.07);color:white;outline:0;padding:0 18px}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:18px;margin-top:28px;align-items:start}.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(20px);box-shadow:0 18px 60px rgba(0,0,0,.28)}
.links{padding:22px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title h2{font-size:14px;margin:0}.title span{font-size:11px;color:var(--muted)}
.cat+ .cat{margin-top:22px}.catlabel{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.link{min-height:48px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.045);color:white;text-decoration:none;display:flex;align-items:center;gap:10px;border:1px solid transparent;transition:.2s ease}.link:hover{background:rgba(255,255,255,.085);transform:translateY(-1px)}.link.highlighted{background:color-mix(in srgb,var(--hl) 18%,rgba(255,255,255,.045));border-color:color-mix(in srgb,var(--hl) 48%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--hl) 12%,transparent) inset,0 10px 28px color-mix(in srgb,var(--hl) 14%,transparent)}.link.highlighted .dot{background:var(--hl);box-shadow:0 0 14px color-mix(in srgb,var(--hl) 65%,transparent)}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.side{display:grid;gap:18px}
.wake{padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px}.wake strong{display:block;font-size:13px}.wake span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.wakebtn.active{background:rgba(158,203,255,.16);border-color:rgba(158,203,255,.42)}
.secret-export{
  position:fixed;
  right:10px;
  bottom:10px;
  width:26px;
  height:26px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(10,13,18,.22);
  color:rgba(255,255,255,.18);
  border-radius:9px;
  display:grid;
  place-items:center;
  font-size:11px;
  opacity:.28;
  transition:.2s ease;
  z-index:50;
  backdrop-filter:blur(8px);
}
.secret-export:hover,
.secret-export:focus{
  opacity:.95;
  color:rgba(255,255,255,.85);
  border-color:rgba(255,255,255,.18);
  background:rgba(20,26,34,.72);
}
@media(max-width:820px){
  .layout{grid-template-columns:1fr}
  .app{width:min(100% - 22px,720px)}
  .secret-export{right:7px;bottom:7px;width:24px;height:24px}
}
</style>
</head>
<body>
<main class="app">
<div class="top"><div id="weather" class="weather">Weather...</div></div>
<section class="hero"><div id="date" class="date"></div><div id="clock" class="clock">00:00</div><form id="searchForm" class="searchw"><input id="search" class="search" placeholder="Search the web..." autocomplete="off"></form></section>
<section class="layout">
<div class="card links"><div class="title"><h2>Shortcuts</h2><span id="count"></span></div><div id="links"></div></div>
<div class="side">

<section class="card wake"><div><strong>Keep Screen Awake</strong><span>Prevent automatic screen sleep when supported.</span></div><button id="wake" class="btn wakebtn">OFF</button></section>
</div>
</section>
</main>

<button id="secretExport" class="secret-export" type="button" title="Export index.html" aria-label="Export index.html">↓</button>

<script id="dashboard-config" type="application/json">{"clock":{"locale":"en-US","showSeconds":false,"hour12":false},"weather":{"label":"Tokyo","latitude":35.6598,"longitude":139.7024},"search":{"engine":"https://www.google.com/search?q="},"builder":{"outputFilename":"index.html"},"linkGroups":[{"name":"Daily","links":[{"label":"ChatGPT","url":"https://chatgpt.com/","highlight":true,"highlightColor":"#ffffff"},{"label":"GitHub","url":"https://github.com/","highlight":false,"highlightColor":"#9ecbff"},{"label":"Drive","url":"https://drive.google.com/","highlight":false,"highlightColor":"#9ecbff"},{"label":"YouTube","url":"https://youtube.com/","highlight":true,"highlightColor":"#ff0000"},{"label":"Weather","url":"https://kentaro222.github.io/today-tomorrow-weather/","highlight":true,"highlightColor":"#ffa600"}]},{"name":"Work","links":[{"label":"Stage Tools","url":"https://kentaro222.github.io/Stage-Tools/","highlight":true,"highlightColor":"#00ff00"},{"label":"Time Tools","url":"https://kentaro222.github.io/Stage-Time-Toolkit/","highlight":true,"highlightColor":"#00ff00"},{"label":"機構シミュ","url":"https://kentaro222.github.io/test02/","highlight":false,"highlightColor":"#9ecbff"},{"label":"機構ライト","url":"https://kentaro222.github.io/stage-cue-sheet-lite/","highlight":true,"highlightColor":"#00ff00"},{"label":"申送作成","url":"https://kentaro222.github.io/Handover-File-Creation-Tool/","highlight":false,"highlightColor":"#9ecbff"}]},{"name":"Tools","links":[{"label":"翻訳","url":"https://translate.google.com/","highlight":false,"highlightColor":"#9ecbff"},{"label":"QR Code","url":"https://kentaro222.github.io/qr-code-generation-and-saver/","highlight":false,"highlightColor":"#9ecbff"},{"label":"MP3ラウドネス調整","url":"https://kentaro222.github.io/audio-loudness-normalizer/","highlight":false,"highlightColor":"#ff9ee0"},{"label":"Pixlet","url":"https://kentaro222.github.io/pixlet/","highlight":true,"highlightColor":"#ffffff"},{"label":"Tate Novel Studio","url":"https://kentaro222.github.io/tatenovel-studio/","highlight":false,"highlightColor":"#9ecbff"},{"label":"スクリプトチェック","url":"https://kentaro222.github.io/tatenovel-scriptchecker/","highlight":false,"highlightColor":"#9ecbff"}]},{"name":"Games","links":[{"label":"LCD JUMP","url":"https://kentaro222.github.io/lcd-jump/","highlight":true,"highlightColor":"#ffffff"},{"label":"Synth-Zooo","url":"https://kentaro222.github.io/synth-zooo/","highlight":false,"highlightColor":"#9ecbff"},{"label":"PIXEL TAROT","url":"https://kentaro222.github.io/pixel-tarot/","highlight":false,"highlightColor":"#9ecbff"},{"label":"BIG CHEESE","url":"https://kentaro222.github.io/big-cheese/","highlight":false,"highlightColor":"#9ecbff"},{"label":"すずめ雀","url":"https://kentaro222.github.io/4p-suzume-jong/","highlight":false,"highlightColor":"#9ecbff"},{"label":"Retro VideoPoker","url":"https://kentaro222.github.io/retro-videopoker/","highlight":false,"highlightColor":"#9ecbff"},{"label":"REGICIDE","url":"https://kentaro222.github.io/regicide/","highlight":false,"highlightColor":"#9ecbff"},{"label":"Quoridor","url":"https://kentaro222.github.io/quoridor/","highlight":false,"highlightColor":"#9ecbff"},{"label":"Ghost-Stairs","url":"https://kentaro222.github.io/ghost-stairs/","highlight":false,"highlightColor":"#9ecbff"},{"label":"CHILL WALK","url":"https://kentaro222.github.io/chill-walk-synthwave/","highlight":false,"highlightColor":"#9ecbff"},{"label":"Music Visualizer","url":"https://kentaro222.github.io/pixel-mascot-music-visualizer/","highlight":false,"highlightColor":"#9ecbff"}]},{"name":"Other","links":[{"label":"ダッシュボード","url":"https://kentaro222.github.io/my-dashboard/","highlight":false,"highlightColor":"#9ecbff"},{"label":"DB更新","url":"https://github.com/kentaro222/my-dashboard","highlight":true,"highlightColor":"#ff00ff"},{"label":"Home Page","url":"https://kentaro222.github.io/KENTARO-S-HOME-PAGE/","highlight":false,"highlightColor":"#9ecbff"}]}],"timer":{"presets":[5,10,25,45],"allowCustom":true,"playSound":true,"wakeWithTimer":false},"theme":{"accent":"#9ecbff"},"backgrounds":["radial-gradient(circle at 20% 15%, #1e3550 0%, #101722 38%, #080b10 100%)","radial-gradient(circle at 78% 20%, #3a2548 0%, #17131f 35%, #090a0d 100%)","radial-gradient(circle at 50% 5%, #243d38 0%, #111d1b 35%, #080b0b 100%)","linear-gradient(135deg, #101827 0%, #11131b 45%, #07090d 100%)"]}</script>

<script>
const CONFIG=JSON.parse(document.getElementById("dashboard-config").textContent);
const weatherEl=document.getElementById("weather");
const dateEl=document.getElementById("date");
const clockEl=document.getElementById("clock");
const searchFormEl=document.getElementById("searchForm");
const searchEl=document.getElementById("search");
const linksEl=document.getElementById("links");
const countEl=document.getElementById("count");
const wakeEl=document.getElementById("wake");
const secretExportEl=document.getElementById("secretExport");

function exportCurrentDashboard(){
  try{
    // Clone the page so transient runtime state is not written back
    // into the live dashboard before exporting.
    const clone=document.documentElement.cloneNode(true);

    // Remove temporary runtime state that should not be baked into the file.
    clone.querySelectorAll(".dragging,.drag-over-category,.drag-over-link").forEach(el=>{
      el.classList.remove("dragging","drag-over-category","drag-over-link");
    });

    // Restore stable title/text where runtime may have changed it.
    const titleEl=clone.querySelector("title");
    if(titleEl) titleEl.textContent="Dashboard";

    const html="<!DOCTYPE html>"+clone.outerHTML;
    const blob=new Blob([html],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");
    a.href=url;
    a.download="index.html";
    a.style.display="none";
    document.body.appendChild(a);
    a.click();

    setTimeout(()=>{
      a.remove();
      URL.revokeObjectURL(url);
    },1000);
  }catch(e){
    console.error(e);
    alert("index.html を出力できませんでした。");
  }
}

secretExportEl.addEventListener("click",exportCurrentDashboard);

function clock(){const n=new Date();dateEl.textContent=n.toLocaleDateString(CONFIG.clock.locale,{weekday:"long",month:"long",day:"numeric"}).toUpperCase();clockEl.textContent=n.toLocaleTimeString(CONFIG.clock.locale,{hour:"2-digit",minute:"2-digit",second:CONFIG.clock.showSeconds?"2-digit":undefined,hour12:CONFIG.clock.hour12})}clock();setInterval(clock,1000);
function wicon(code){if(code===0)return"☀";if(code<=3)return"⛅";if(code<=48)return"🌫";if(code<=67)return"🌧";if(code<=77)return"❄";if(code<=82)return"🌦";return"⛈"}
fetch("https://api.open-meteo.com/v1/forecast?latitude="+CONFIG.weather.latitude+"&longitude="+CONFIG.weather.longitude+"&current=temperature_2m,weather_code&timezone=auto").then(r=>r.json()).then(d=>weatherEl.textContent=wicon(d.current.weather_code)+"  "+CONFIG.weather.label+"  "+Math.round(d.current.temperature_2m)+"°C").catch(()=>weatherEl.textContent=CONFIG.weather.label+" · Weather unavailable");
searchFormEl.onsubmit=e=>{e.preventDefault();const q=searchEl.value.trim();if(q)window.open(CONFIG.search.engine+encodeURIComponent(q),"_blank")};
let total=0;linksEl.innerHTML=CONFIG.linkGroups.map(g=>{total+=g.links.length;return'<section class="cat"><div class="catlabel">'+g.name+'</div><div class="grid">'+g.links.map(x=>{const cls=x.highlight?"link highlighted":"link";const hl=x.highlightColor || "#9ecbff";const style=x.highlight?' style="--hl:'+hl+'"':"";return'<a class="'+cls+'"'+style+' target="_blank" rel="noopener" href="'+x.url+'"><span class="dot"></span>'+x.label+'</a>'}).join("")+'</div></section>'}).join("");countEl.textContent=total+" links";
let lock=null,requested=false;function wakeDraw(){wakeEl.classList.toggle("active",!!lock);wakeEl.textContent=lock?"ON":"OFF"}
async function requestWake(){if(!("wakeLock" in navigator))return;try{lock=await navigator.wakeLock.request("screen");requested=true;wakeDraw();lock.addEventListener("release",()=>{lock=null;wakeDraw()})}catch(e){}}
async function releaseWake(){requested=false;if(lock){try{await lock.release()}catch(e){}}lock=null;wakeDraw()}
wakeEl.onclick=()=>lock||requested?releaseWake():requestWake();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&requested&&!lock)requestWake()});wakeDraw();
</script>
</body>
</html>
